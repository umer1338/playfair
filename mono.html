<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monoalphabetic Substitution Cipher</title>
<style>
body {
    background-color: #1e1e1e;
    color: #00ff99;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
}

h1 {
    text-shadow: 0 0 10px #00ff99;
}

input, textarea {
    width: 400px;
    padding: 15px;
    margin: 10px 0;
    border: 2px solid #00ff99;
    border-radius: 5px;
    background-color: #1e1e1e;
    color: #00ff99;
    font-size: 20px;
}

#buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

button {
    padding: 12px 25px;
    margin: 5px;
    border-radius: 5px;
    border: 2px solid #00ff99;
    background-color: #1e1e1e;
    color: #00ff99;
    font-weight: bold;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
}

button:hover {
    background-color: #00ff99;
    color: #1e1e1e;
}

#result {
    margin-top: 20px;
    min-height: 60px;
    font-size: 28px;
    text-align: center;
    border: 2px solid #00ff99;
    width: 400px;
    padding: 15px;
    border-radius: 5px;
    word-break: break-word;
}

.letter {
    display: inline-block;
    min-width: 25px;
    transition: color 0.3s, transform 0.3s;
}
</style>
</head>
<body>

<h1>Monoalphabetic Substitution Cipher</h1>

<textarea id="text" rows="4" placeholder="Enter Message"></textarea>

<div id="buttons">
    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>
</div>

<div id="result"></div>

<script>
// Plaintext & Cipher alphabet
const plaintext = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const cipher =     "QWERTYUIOPASDFGHJKLZXCVBNM".split("");

// Helper: clean input
function cleanText(text) {
    return text.toUpperCase().replace(/[^A-Z ]/g, "");
}

// Animate letter substitution
function animateLetter(letterElem, finalChar, delay) {
    let startCode = 65; // 'A'
    let endCode = finalChar.charCodeAt(0);
    let currentCode = letterElem.innerText.charCodeAt(0) || 65;
    let step = 1;

    let interval = setInterval(() => {
        if (currentCode > 90) currentCode = 65;
        letterElem.innerText = String.fromCharCode(currentCode);
        letterElem.style.color = "#ff00ff";
        currentCode++;
        if (currentCode - 65 >= endCode - 65) {
            clearInterval(interval);
            letterElem.innerText = finalChar;
            letterElem.style.color = "#00ff99";
        }
    }, 80 + delay);
}

// Encrypt
function encrypt() {
    let text = cleanText(document.getElementById("text").value);
    if (!text) return alert("Enter a message!");

    let resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        let span = document.createElement("span");
        span.className = "letter";
        span.innerText = char;
        resultDiv.appendChild(span);

        if (char !== " ") {
            let index = plaintext.indexOf(char);
            let finalChar = cipher[index];
            setTimeout(() => animateLetter(span, finalChar, i*50), i*100);
        }
    }
}

// Decrypt
function decrypt() {
    let text = cleanText(document.getElementById("text").value);
    if (!text) return alert("Enter a message!");

    let resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        let span = document.createElement("span");
        span.className = "letter";
        span.innerText = char;
        resultDiv.appendChild(span);

        if (char !== " ") {
            let index = cipher.indexOf(char);
            let finalChar = plaintext[index];
            setTimeout(() => animateLetter(span, finalChar, i*50), i*100);
        }
    }
}
</script>

</body>
</html>
